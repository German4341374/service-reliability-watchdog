name: Bug report
description: Report reproducible monitoring behavior using synthetic endpoints.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include production URLs, headers, credentials, certificates, or customer data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include sanitized YAML and exact commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true

